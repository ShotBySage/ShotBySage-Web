<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews | Shot By Sage</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reviews.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Shot By Sage
        </a>

        <button
            class="menu-toggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="site-nav">
            <a href="about.html">About</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main class="reviews-page">

        <!-- INTRO -->

        <section class="reviews-intro">

            <h1>Reviews.</h1>

            <p class="reviews-intro-text">
                Some nice things people have said.
            </p>

        </section>


        <!-- REVIEWS -->

        <section class="reviews-section">

            <div
                id="reviews-container"
                class="reviews-container"
            >

                <p class="reviews-loading">
                    Loading reviews...
                </p>

            </div>

        </section>


        <!-- LEAVE A REVIEW -->

        <section class="leave-review">

            <h2>Worked with me?</h2>

            <p>
                Tell me how it went.
            </p>

            <a
                href="https://docs.google.com/forms/d/e/1FAIpQLSdby_qYZfBm3MakJMslmL5vLXaqEt86iUHj4UM1h32aPKvt_g/viewform?usp=header"
                class="review-button"
                target="_blank"
                rel="noopener noreferrer"
            >
                Leave a review
            </a>

        </section>

    </main>


    <script src="js/reviews.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
